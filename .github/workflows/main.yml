name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Use Java 17 — required by modern Android Gradle Plugin
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # Cache Gradle to speed up builds and make them more stable
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/**', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup Flutter after JDK so Flutter/Gradle detect the correct JAVA_HOME
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true

      # Ensure Flutter uses the JDK provided by actions/setup-java
      - name: Configure Flutter to use JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          flutter config --jdk-dir="$JAVA_HOME"

      - name: Verify environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          flutter --version
          flutter doctor --verbose || true

      # Cache pub/packages (uses pubspec.lock for key stability)
      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      # Run static analysis and fail early if issues exist
      - name: Analyze (fail on issues)
        run: flutter analyze

      # Run tests if present (will skip if no test/ folder)
      - name: Run tests (if any)
        run: |
          if [ -d test ]; then
            echo "Found tests. Running flutter test..."
            flutter test --coverage
          else
            echo "No tests found — skipping flutter test"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/apk/release/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          tag_name: v${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
